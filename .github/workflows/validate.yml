name: Validate HookMaster Skill
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Validate package
        run: python tests/validate_skill.py
      - name: Test validator failure detection
        run: python tests/test_validator.py
